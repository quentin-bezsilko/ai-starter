services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:latest
    container_name: liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../liquibase/changelog:/liquibase/changelog
      - ../liquibase/liquibase.properties:/liquibase/liquibase.properties
      - ../liquibase/lib:/liquibase/lib
    command:
      - --search-path=/liquibase
      - --url=jdbc:postgresql://postgres:5432/aistarter
      - --username=aistarter
      - --password=aistarter
      - --changelog-file=changelog/db.changelog-master.yml
      - update
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-travel-assistant
    ports:
      - "${SERVER_PORT}:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10


  ollama-init:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
    restart: "no"
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for model in "$$OLLAMA_MODEL" "$$OLLAMA_EMBEDDING_MODEL"; do
          echo "Pulling model $$model"
          ollama pull "$$model"
        done
        echo "All models ready"

volumes:
  postgres_data:
  ollama_data: