server:
  servlet:
    context-path: /aistarter

spring:
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    ollama:
      base-url: ${OLLAMA_URL}
      chat:
        options:
          model: ${OLLAMA_MODEL}
          temperature: ${OLLAMA_TEMPERATURE:0.7}
          num-predict: ${OLLAMA_NUM_PREDICT:3500}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL}
      vectorstore:
        pgvector:
          initialize-schema: false
          index-type: HNSW
          distance-type: COSINE_DISTANCE
          dimensions: 768
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info