server:
  servlet:
    context-path: /aistarter

spring:
  ai:
    ollama:
      base-url: ${OLLAMA_URL}
      chat:
        options:
          model: ${OLLAMA_MODEL}
          temperature: ${OLLAMA_TEMPERATURE:0.7}
          num-predict: ${OLLAMA_NUM_PREDICT:3500}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL}
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
  mcp:
    server:
      name: geography-mcp
      version: 1.0.0
  application:
    name: ai-starter
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.ai: INFO