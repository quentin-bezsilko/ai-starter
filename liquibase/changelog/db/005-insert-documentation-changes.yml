
databaseChangeLog:
  - changeSet:
      id: 008-insert-spring-boot-source
      author: qbe
      changes:
        - insert:
            tableName: documentation_source
            columns:
              - column:
                  name: name
                  value: Spring Boot Documentation
              - column:
                  name: technology
                  value: SPRING_BOOT
              - column:
                  name: source_type
                  value: WEB
              - column:
                  name: url
                  value: https://docs.spring.io/spring-boot/index.html
              - column:
                  name: allowed_host
                  value: docs.spring.io
              - column:
                  name: crawl_enabled
                  valueBoolean: true
              - column:
                  name: max_depth
                  valueNumeric: 2
