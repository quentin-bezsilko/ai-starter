databaseChangeLog:
  - changeSet:
      id: 006-create-documentation-chunk-vector-index
      author: qbe
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_documentation_chunk_embedding
                tableName: documentation_chunk
      changes:
        - sql:
            sql: >
              CREATE INDEX idx_documentation_chunk_embedding
              ON documentation_chunk
              USING hnsw (embedding vector_cosine_ops);