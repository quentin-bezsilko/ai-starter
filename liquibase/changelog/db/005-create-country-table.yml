databaseChangeLog:
  - changeSet:
      id: 005-create-country-table
      author: qbe
      changes:
        - createTable:
            tableName: country
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: iso_code
                  type: varchar(2)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: continent_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: country
            baseColumnNames: continent_id
            referencedTableName: continent
            referencedColumnNames: id
            constraintName: fk_country_continent