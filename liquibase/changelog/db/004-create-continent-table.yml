databaseChangeLog:
  - changeSet:
      id: 004-create-continent-table
      author: qbe
      changes:
        - createTable:
            tableName: continent
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: code
                  type: varchar(3)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false