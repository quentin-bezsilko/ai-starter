
databaseChangeLog:
  - changeSet:
      id: 003-create-message-table
      author: qbe
      changes:
        - createTable:
            tableName: message
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_message
                    nullable: false
              - column:
                  name: conversation_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_message_conversation
            baseTableName: message
            baseColumnNames: conversation_id
            referencedTableName: conversation
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: >
              ALTER TABLE message
              ADD CONSTRAINT chk_message_role
              CHECK (role IN ('USER', 'ASSISTANT'));

        - createIndex:
            tableName: message
            indexName: idx_message_conversation_id
            columns:
              - column:
                  name: conversation_id
        - createIndex:
            tableName: message
            indexName: idx_message_created_at
            columns:
              - column:
                  name: created_at
        - createIndex:
            tableName: message
            indexName: idx_message_conversation_created
            columns:
              - column:
                  name: conversation_id
              - column:
                  name: created_at
