
databaseChangeLog:
  - changeSet:
      id: 004-enable-pgvector
      author: qbe
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS vector;
  - changeSet:
      id: 005-create-documentation-source
      author: qbe
      changes:
        - createTable:
            tableName: documentation_source
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_documentation_source
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: technology
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: source_type
                  type: varchar(20)
                  defaultValue: WEB
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: text
              - column:
                  name: allowed_host
                  type: varchar(255)
              - column:
                  name: version
                  type: varchar(50)
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: crawl_enabled
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: max_depth
                  type: integer
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: crawl_frequency_hours
                  type: integer
                  defaultValueNumeric: 168
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: last_crawled_at
                  type: timestamp with time zone
              - column:
                  name: last_success_at
                  type: timestamp with time zone
              - column:
                  name: last_error
                  type: text
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE documentation_source
              ADD CONSTRAINT chk_documentation_source_type
              CHECK (source_type IN ('WEB', 'FILE'));
        - sql:
            sql: >
              ALTER TABLE documentation_source
              ADD CONSTRAINT chk_documentation_source_status
              CHECK (status IN ('PENDING', 'PROCESSING', 'SUCCESS', 'FAILED'));
        - sql:
            sql: >
              ALTER TABLE documentation_source
              ADD CONSTRAINT chk_documentation_source_depth
              CHECK (max_depth >= 0);
        - createIndex:
            tableName: documentation_source
            indexName: idx_documentation_source_technology
            columns:
              - column:
                  name: technology
        - createIndex:
            tableName: documentation_source
            indexName: idx_documentation_source_enabled
            columns:
              - column:
                  name: enabled
              - column:
                  name: crawl_enabled
  - changeSet:
      id: 006-create-documentation-document
      author: qbe
      changes:
        - createTable:
            tableName: documentation_document
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_documentation_document
                    nullable: false
              - column:
                  name: source_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: canonical_url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: varchar(50)
              - column:
                  name: content_hash
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: metadata
                  type: jsonb
                  defaultValue: '{}'
                  constraints:
                    nullable: false
              - column:
                  name: ingested_at
                  type: timestamp with time zone
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_documentation_document_source
            baseTableName: documentation_document
            baseColumnNames: source_id
            referencedTableName: documentation_source
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            sql: >
              ALTER TABLE documentation_document
              ADD CONSTRAINT chk_documentation_document_status
              CHECK (status IN ('PENDING', 'PROCESSING', 'SUCCESS', 'FAILED'));
        - addUniqueConstraint:
            tableName: documentation_document
            columnNames: source_id, canonical_url, content_hash
            constraintName: uk_documentation_document_content
        - createIndex:
            tableName: documentation_document
            indexName: idx_documentation_document_source
            columns:
              - column:
                  name: source_id
        - createIndex:
            tableName: documentation_document
            indexName: idx_documentation_document_status
            columns:
              - column:
                  name: status
  - changeSet:
      id: 007-create-documentation-chunk
      author: qbe
      changes:
        - createTable:
            tableName: documentation_chunk
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_documentation_chunk
                    nullable: false
              - column:
                  name: document_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: chunk_index
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: token_count
                  type: integer
              - column:
                  name: embedding
                  type: vector(768)
              - column:
                  name: metadata
                  type: jsonb
                  defaultValue: '{}'
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_documentation_chunk_document
            baseTableName: documentation_chunk
            baseColumnNames: document_id
            referencedTableName: documentation_document
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: documentation_chunk
            columnNames: document_id, chunk_index
            constraintName: uk_documentation_chunk_index
        - createIndex:
            tableName: documentation_chunk
            indexName: idx_documentation_chunk_document
            columns:
              - column:
                  name: document_id
        - sql:
            sql: >
              CREATE INDEX idx_documentation_chunk_embedding
              ON documentation_chunk
              USING hnsw (embedding vector_cosine_ops);
