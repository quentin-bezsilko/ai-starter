databaseChangeLog:
  - changeSet:
      id: 002-create-conversation-table
      author: qbe
      changes:
        - createTable:
            tableName: conversation
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_conversation
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createIndex:
            tableName: conversation
            indexName: idx_conversation_created_at
            columns:
              - column:
                  name: created_at