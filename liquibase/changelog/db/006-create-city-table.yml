databaseChangeLog:
  - changeSet:
      id: 006-create-city-table
      author: qbe
      changes:
        - createTable:
            tableName: city
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: country_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: population
                  type: bigint
              - column:
                  name: latitude
                  type: decimal(10,6)
              - column:
                  name: longitude
                  type: decimal(10,6)
              - column:
                  name: is_capital
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: city
            baseColumnNames: country_id
            referencedTableName: country
            referencedColumnNames: id
            constraintName: fk_city_country